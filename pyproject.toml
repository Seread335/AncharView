[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ancharview"
version = "0.2.0"
description = "Task-aware desktop visibility and control for MCP agents"
requires-python = ">=3.10"
dependencies = [
  "mcp==2.2.0",
  "mss>=10.2,<11",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
windows = ["pywinauto>=0.6.9"]
linux = ["pyautogui>=0.9.54"]
dev = ["pytest>=8.0"]

[project.scripts]
ancharview = "ancharview.server:main"

[tool.setuptools.packages.find]
where = ["src"]